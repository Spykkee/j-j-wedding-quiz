<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF8F5">
  <title>J&amp;J Wedding Quiz — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="shell shell--wide">

    <!-- Sign in ------------------------------------------------------------ -->
    <section id="gate" class="gate hidden">
      <div class="panel">
        <div class="gate__seal">J&amp;J</div>
        <h1 class="h-display">Quiz admin</h1>
        <p class="lead" style="margin-top:.5rem">Sign in with the account you created in the
          Firebase console.</p>
        <div style="margin-top:1.3rem">
          <label class="field">
            <span class="field__label">Email</span>
            <input id="gate-email" class="input" type="email" autocomplete="username" enterkeyhint="next">
          </label>
          <label class="field">
            <span class="field__label">Password</span>
            <input id="gate-pw" class="input" type="password" autocomplete="current-password" enterkeyhint="go">
          </label>
          <div id="gate-err" class="error" role="alert"></div>
          <button id="gate-go" class="btn btn--primary btn--block" style="margin-top:.6rem">Sign in</button>
        </div>
      </div>
    </section>

    <!-- Console ------------------------------------------------------------ -->
    <div id="console" class="hidden">

      <header class="brand">
        <div class="brand__mark">
          <span class="brand__seal">J&amp;J</span>
          <div class="brand__text">
            <div class="brand__title">Quiz admin</div>
            <div class="brand__sub" id="who">—</div>
          </div>
        </div>
        <div class="row row--tight">
          <a class="btn btn--ghost btn--sm" href="host.html" target="_blank" rel="noopener">Big screen ↗</a>
          <button id="signout" class="btn btn--ghost btn--sm">Sign out</button>
        </div>
      </header>

      <nav class="tabbar">
        <button class="tabbar__tab is-on" data-tab="run">Run the game</button>
        <button class="tabbar__tab" data-tab="build">Build the quiz</button>
        <button class="tabbar__tab" data-tab="tables">Tables</button>
      </nav>

      <section id="pane-run" class="tabpane is-on"></section>
      <section id="pane-build" class="tabpane"></section>
      <section id="pane-tables" class="tabpane"></section>

    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
