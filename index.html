<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F5">
  <title data-i18n="doc.join">J&amp;J Wedding Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <div class="shell">

    <header class="brand">
      <div class="brand__mark">
        <span class="brand__seal">J&amp;J</span>
        <div class="brand__text">
          <div class="brand__title" data-i18n="brand.title">The J &amp; J Quiz</div>
          <div class="brand__sub" data-i18n="brand.sub">10 · 10 · 2026 · Provence</div>
        </div>
      </div>
      <details class="lang-menu">
        <summary class="lang-menu__toggle" data-i18n-aria="ui.lang" aria-label="Language">
          <svg class="lang-menu__globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.7 3.9 5.9 3.9 9S14.6 18.3 12 21c-2.6-2.7-3.9-5.9-3.9-9S9.4 5.7 12 3Z"/></svg>
          <span class="lang-menu__code" data-lang-code>EN</span>
          <svg class="lang-menu__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="lang-menu__list" role="menu">
          <button type="button" class="lang-btn" data-lang="en">English</button>
          <button type="button" class="lang-btn" data-lang="fr">Français</button>
          <button type="button" class="lang-btn" data-lang="ko">한국어</button>
        </div>
      </details>
    </header>

    <main id="app" class="stack"></main>

    <div id="standing" class="standing hidden">
      <div>
        <div class="standing__label" data-i18n="play.yourScore">Your score</div>
        <div id="standing-team" class="fine"></div>
      </div>
      <div style="text-align:right">
        <div id="standing-score" class="standing__score tnum">0</div>
        <div id="standing-place" class="standing__label"></div>
      </div>
    </div>

    <noscript>
      <div class="panel">This quiz needs JavaScript switched on. If you are using a private
      browsing window, try a normal one.</div>
    </noscript>
  </div>

  <script type="module" src="js/play.js"></script>
</body>
</html>
